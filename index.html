<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 HYFL Portfolio Gallery</title>

<!-- Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <span class="mark">26</span>
      <span>
        <b>HYFL Portfolio Gallery</b>
        <span class="sub">Student Web Exhibition</span>
      </span>
    </div>
  </div>
</header>

<!-- ============================ HERO ============================ -->
<section class="hero">
  <div class="hero-inner">
    <span class="kicker">Portfolio Exhibition</span>
    <h1>2026 HYFL Portfolio Gallery</h1>
    <p>AI와 함께 만든 우리들의 자기소개 웹앱 전시관입니다. 학생들이 직접 제작한 작품을 둘러보세요.</p>

    <div class="badges">
      <span class="badge">전체 작품 <b id="stat-works">0</b>개</span>
      <span class="badge">참여 반 <b id="stat-classes">0</b>개</span>
      <span class="badge live"><span class="dot"></span>실시간 시트 연동</span>
    </div>
  </div>
</section>

<!-- ============================ SEARCH + FILTERS ============================ -->
<div class="controls">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="이름 · 작품 제목 · 설명 검색" autocomplete="off" aria-label="작품 검색" />
  </label>
  <nav class="filters" id="filters" aria-label="반 필터"></nav>
</div>

<!-- ============================ SECTION HEAD ============================ -->
<div class="section-head">
  <h2>작품 전시</h2>
  <div class="count" id="section-count"></div>
</div>

<!-- ============================ GALLERY GRID ============================ -->
<main class="wall">
  <div class="grid" id="grid"></div>
</main>

<footer class="footer">
  <div class="fw">HYFL Portfolio Gallery</div>
  <p>AI와 함께 만든 우리들의 자기소개 웹앱 전시관</p>
  <div class="meta">Built with HTML · CSS · JavaScript</div>
</footer>

<script src="script.js"></script>
</body>
</html>
