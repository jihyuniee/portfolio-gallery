<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 HYFL Portfolio Gallery</title>

<!-- Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <span class="emoji">🎨</span>
      <span>
        <b>HYFL Portfolio Gallery</b>
        <span class="sub" style="display:block">2026</span>
      </span>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="이름 · 작품 제목 검색" autocomplete="off" aria-label="작품 검색" />
    </label>
  </div>
</header>

<!-- ============================ HERO ============================ -->
<section class="hero">
  <span class="kicker">✨ 2026 Exhibition</span>
  <h1>2026 HYFL Portfolio Gallery</h1>
  <p>AI와 함께 만든 우리들의 자기소개 웹앱 전시관 — 우리 반 친구들의 작품을 구경해 보세요!</p>

  <div class="stats">
    <div class="stat">
      <div class="num pink" id="stat-works">0</div>
      <div class="label">전체 작품 수</div>
    </div>
    <div class="stat">
      <div class="num purple" id="stat-classes">0</div>
      <div class="label">참여 반 수</div>
    </div>
    <div class="stat">
      <div class="num blue">💛</div>
      <div class="label">우리들의 이야기</div>
    </div>
  </div>
</section>

<!-- ============================ CLASS FILTERS ============================ -->
<nav class="filters" id="filters" aria-label="반 필터"></nav>

<!-- ============================ SECTION HEAD ============================ -->
<div class="section-head">
  <h2><span class="pin">🖼️</span>작품 전시</h2>
  <div class="count" id="section-count"></div>
</div>

<!-- ============================ GALLERY GRID ============================ -->
<main class="wall">
  <div class="grid" id="grid"></div>
</main>

<footer class="footer">
  <div class="fw">🎓 2026 HYFL Portfolio Gallery</div>
  <p>AI와 함께 만든 우리들의 자기소개 웹앱 전시관</p>
  <div class="meta">Built with HTML · CSS · JavaScript</div>
</footer>

<script src="script.js"></script>
</body>
</html>
